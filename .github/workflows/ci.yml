name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so advisories published against unchanged pins and base image still fail CI.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q
      # Audits the exact hashed pins that ship, without re-resolving anything.
      - run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt
      # The build installs the hashed lock and runs pip-audit again as a deployment gate.
      - run: docker build --pull -t uptime-status:ci .
      - name: Scan image (OS packages and Python dependencies)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: uptime-status:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
