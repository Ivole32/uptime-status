services:
  uptime:
    build: .
    image: uptime-status:local
    container_name: uptime-status
    restart: unless-stopped
    # Bound to localhost only: put a TLS-terminating reverse proxy in front (see README).
    ports:
      - "127.0.0.1:${UPTIME_PORT:-8000}:8000"
    networks:
      - uptime
    environment:
      UPTIME_COOKIE_SECURE: ${UPTIME_COOKIE_SECURE:-true}
      UPTIME_ALLOWED_HOSTS: ${UPTIME_ALLOWED_HOSTS:-}
      # Requests to the published port arrive from this network's gateway, which is
      # where a reverse proxy on the host connects from. Trust its X-Forwarded-For.
      UPTIME_FORWARDED_ALLOW_IPS: ${UPTIME_FORWARDED_ALLOW_IPS:-172.30.0.1}
      UPTIME_ALLOW_PRIVATE_TARGETS: ${UPTIME_ALLOW_PRIVATE_TARGETS:-false}
      UPTIME_BLOCKED_NETWORKS: ${UPTIME_BLOCKED_NETWORKS:-}
      UPTIME_SESSION_TTL_HOURS: ${UPTIME_SESSION_TTL_HOURS:-12}
      UPTIME_RAW_RETENTION_DAYS: ${UPTIME_RAW_RETENTION_DAYS:-30}
      UPTIME_PUBLIC_REFRESH_SECONDS: ${UPTIME_PUBLIC_REFRESH_SECONDS:-30}
      UPTIME_CHECK_CONCURRENCY: ${UPTIME_CHECK_CONCURRENCY:-10}
      UPTIME_DEGRADED_FACTOR: ${UPTIME_DEGRADED_FACTOR:-2}
      UPTIME_DEGRADED_MIN_MS: ${UPTIME_DEGRADED_MIN_MS:-200}
      UPTIME_ALLOWED_PORTS: ${UPTIME_ALLOWED_PORTS:-80,443,8080,8443}
    volumes:
      - uptime-data:/data
      # Mount the directory, not the file: a single-file bind mount is pinned to
      # the original inode, so edits saved via rename (sed -i, vim, Ansible, ...)
      # would never reach the container and a password change would silently not apply.
      - type: bind
        source: ./config
        target: /config
        read_only: true
        bind:
          create_host_path: false
    # Hardening
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Threads count as pids. Keep pids_limit >= 3 x UPTIME_CHECK_CONCURRENCY + 50,
    # i.e. concurrency <= 25 with 128 (see README, "Sizing UPTIME_CHECK_CONCURRENCY").
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Dedicated network for this service group only. Other stacks cannot reach the
  # container. It is not `internal`, because checks need outbound internet access.
  uptime:
    name: uptime-status
    driver: bridge
    driver_opts:
      # Stable host-side interface name, handy for host firewall rules.
      com.docker.network.bridge.name: br-uptime
    ipam:
      config:
        # Fixed subnet so the gateway address trusted above is predictable.
        - subnet: ${UPTIME_SUBNET:-172.30.0.0/24}

  # Proxy running in another container instead of on the host? Create a shared
  # network once (`docker network create proxy`), attach only the proxy and this
  # service to it, uncomment below, add `- proxy` to the service's networks, and
  # set UPTIME_FORWARDED_ALLOW_IPS to the proxy container's address.
  # proxy:
  #   external: true

volumes:
  uptime-data:
